[project]
name = "my-backend"
version = "0.1.0"
description = "Production FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.31.0",
    "alembic>=1.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pydantic[email]>=2.10.0",
    "authlib>=1.6.0",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "logfire[fastapi,asyncpg]>=4.0.0",
    "slowapi>=0.1.9",
    "livekit-agents>=1.0.0",
    "livekit-plugins-deepgram>=1.0.0",
    "livekit-plugins-openai>=1.0.0",
    "livekit-plugins-elevenlabs>=1.0.0",
    "livekit-plugins-silero>=1.0.0",
    "livekit-api>=1.0.0",
    "pgvector>=0.4.0",
    "pydantic-ai>=1.82.0",
    "openai>=1.60.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.409",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
exclude = [
    ".venv",
    "backend/alembic/versions",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
]
ignore = [
    "B008",  # FastAPI intentionally uses Depends/Query calls in defaults.
    "B904",  # Adopt explicit exception chaining incrementally.
    "B905",  # Adopt strict zip semantics incrementally.
    "E402",  # Some entrypoints load environment before app imports.
    "E501",  # Ruff format owns wrapping; long strings are handled case-by-case.
]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/env.py" = ["E402"]
"backend/tests/**/*.py" = ["ARG"]

[tool.pyright]
include = [
    "backend/app",
    "backend/agent_worker.py",
]
exclude = [
    ".venv",
    "backend/alembic",
]
extraPaths = ["backend"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateImportUsage = false
