[project]
name = "my-backend"
version = "0.1.0"
description = "Production FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.31.0",
    "alembic>=1.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pydantic[email]>=2.10.0",
    "authlib>=1.6.0",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "logfire[fastapi,asyncpg]>=4.0.0",
    "slowapi>=0.1.9",
    "livekit-agents>=1.0.0",
    "livekit-plugins-deepgram>=1.0.0",
    "livekit-plugins-openai>=1.0.0",
    "livekit-plugins-elevenlabs>=1.0.0",
    "livekit-plugins-silero>=1.0.0",
    "livekit-api>=1.0.0",
    "pgvector>=0.4.0",
    "openai>=1.60.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
